aid: chai-discovery
name: Chai Discovery
description: 'Chai Discovery builds frontier AI to predict and reprogram the interactions
  between biochemical molecules. Its flagship Chai-1 is a multi-modal foundation model
  for biomolecular structure prediction across proteins, small molecules, DNA, RNA,
  glycans, and multi-component complexes, released as an open-source Python package
  (Apache 2.0) and as a hosted commercial server. Chai-2 extends the platform to de
  novo antibody design, generating novel antibodies directly from target epitopes
  without iterative wet-lab screening. Founded in 2023, Chai Discovery is a venture-backed
  digital-biology company whose developer surface centers on the chai_lab Python
  package, a command-line interface, and the hosted Chai Design platform.'
